[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-eval"
version = "0.1.0"
description = "AI Coding Tool Comparison System - research, profile, and compare AI coding tools on demand."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
    "Jinja2>=3,<4",
    "markdown-it-py>=3,<4",
    "nh3>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
tool-eval = "tool_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_eval"]

[tool.hatch.build.targets.wheel.force-include]
"src/tool_eval/validation/schemas" = "tool_eval/validation/schemas"
"src/tool_eval/reporting/templates" = "tool_eval/reporting/templates"
"src/tool_eval/reporting/static" = "tool_eval/reporting/static"
